name: sfm

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfm_db
    networks:
      - sfm_network
    ports:
    - "5432:5432" 
    environment:
      POSTGRES_DB: sfm
      POSTGRES_USER: sfm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfm_backend
    networks:
      - sfm_network
    ports:
    - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sfm:${DB_PASSWORD}@postgres:5432/${DB_NAME:-sfm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      MQTT_BROKER: mqtt://host.docker.internal:1883
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: sfm_frontend
    networks:
      - sfm_network
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  sfm_network:
    driver: bridge

volumes:
  postgres_data: